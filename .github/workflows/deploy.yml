name: "DEPLOY MEEDO API"

on:
  push:
    branches: ["main", "staging"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "TAG=prod" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/meedo-v3/prod" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == 'refs/heads/staging' ]]; then
            echo "TAG=stg" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/meedo-v3/stg" >> $GITHUB_ENV
          else
            echo "TAG=dev" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/meedo-v3/dev" >> $GITHUB_ENV
          fi

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API
        run: |
          docker build -t geoplanoperation/meedo-api:${{ env.TAG }} -f Dockerfile .
          docker push geoplanoperation/meedo-api:${{ env.TAG }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/${{ env.DEPLOY_PATH }}
            echo "[MESSAGE] Preparing image for ${{ env.TAG }}...."

            # Export the image name for docker-compose
            export API_IMAGE="geoplanoperation/meedo-api:${{ env.TAG }}"

            echo "[MESSAGE] Pulling latest image..."
            docker compose pull api

            # Staging only. geo-postgres also answers to the name "meedo-v3-db-stg" on geo-network,
            # so each new DB connection landed on one of two databases at random (sessions "vanished",
            # users were logged out, writes were split). Give the real staging DB container a network
            # alias only it has and point DATABASE_URL at it. That container is not in the compose
            # file, so the alias is set with docker network connect; it stays on the container across
            # restarts. Runs once; later deploys find the env already changed.
            if [ "${{ env.TAG }}" = "stg" ]; then
            bash <<'APPLY_DB_ALIAS'
            set -euo pipefail
            DB=meedo-v3-db-stg; API=meedo-v3-api-stg; NET=geo-network; ALIAS=meedo-stg-postgres; STATE=.db-alias-fix.state
            ENVFILES=$(grep -l "@$DB:5432/" .env .env.* *.env 2>/dev/null | grep -v '\.bak-' || true)
            if [ -z "$ENVFILES" ]; then echo "[MESSAGE] No env file here uses @$DB:5432/; nothing to change"; exit 0; fi
            aliases() { docker inspect "$DB" -f "{{json (index .NetworkSettings.Networks \"$NET\").Aliases}}"; }
            if aliases | grep -q "\"$ALIAS\""; then
              echo "[MESSAGE] $DB already has the alias $ALIAS"
            else
              OLD=()
              for a in $(aliases | tr -d '[]"' | tr ',' ' '); do [ "$a" = null ] || OLD+=(--alias "$a"); done
              docker network disconnect "$NET" "$DB"
              if ! docker network connect "${OLD[@]}" --alias "$ALIAS" "$NET" "$DB"; then
                docker network connect "${OLD[@]}" "$NET" "$DB" || docker network connect "$NET" "$DB" ||
                  echo "[ERROR] $DB could not be reconnected to $NET; reconnect it by hand"
                echo "[ERROR] could not add the alias $ALIAS; env left unchanged"; exit 1
              fi
            fi
            ADDRS=$(docker exec "$API" nslookup "$ALIAS" 2>/dev/null | awk '/^Address/ && $2 !~ /:53$/ {print $2}' | sort -u)
            DBIP=$(docker inspect "$DB" -f "{{with index .NetworkSettings.Networks \"$NET\"}}{{.IPAddress}}{{end}}")
            if [ "$ADDRS" != "$DBIP" ]; then echo "[ERROR] $ALIAS resolves to '$(echo $ADDRS)', expected only $DBIP; env left unchanged"; exit 1; fi
            STAMP=$(date +%Y%m%d%H%M%S)
            for f in $ENVFILES; do cp "$f" "$f.bak-$STAMP"; done
            printf '%s\n' "$STAMP" $ENVFILES > "$STATE"
            for f in $ENVFILES; do sed -i "s#@$DB:5432/#@$ALIAS:5432/#" "$f"; done
            echo "[MESSAGE] DATABASE_URL now uses $ALIAS ($DBIP only). Env backups: *.bak-$STAMP"
            APPLY_DB_ALIAS
            fi

            echo "[MESSAGE] Deploying service..."
            docker compose up -d --force-recreate api

            # Staging only: the API must start and its DB host must resolve to the staging DB container only.
            # If the step above changed the env and this fails, the env is restored and the deploy fails.
            CHECK_STATUS=0
            if [ "${{ env.TAG }}" = "stg" ]; then
            bash <<'CHECK_DB_HOST' || CHECK_STATUS=1
            set -uo pipefail
            API=meedo-v3-api-stg; DB=meedo-v3-db-stg; NET=geo-network; STATE=.db-alias-fix.state
            # 127.0.0.1, not localhost: on Alpine localhost is ::1 and the API listens on IPv4.
            health() { docker exec "$API" sh -c 'wget -qO- "http://127.0.0.1:${PORT:-8000}/api/v1/health"' >/dev/null 2>&1; }
            for i in $(seq 1 40); do health && break; sleep 3; done
            ok=1; health || { echo "[ERROR] API health check failed"; ok=0; }
            HOST=$(docker exec "$API" printenv DATABASE_URL | sed -E 's#^[^@]*@([^:/]+).*#\1#')
            ADDRS=$(docker exec "$API" nslookup "$HOST" 2>/dev/null | awk '/^Address/ && $2 !~ /:53$/ {print $2}' | sort -u)
            DBIP=$(docker inspect "$DB" -f "{{with index .NetworkSettings.Networks \"$NET\"}}{{.IPAddress}}{{end}}" 2>/dev/null)
            echo "[MESSAGE] DB host $HOST resolves to: $(echo $ADDRS) ($DB on $NET: ${DBIP:-not connected})"
            [ -n "$DBIP" ] && [ "$ADDRS" = "$DBIP" ] || { echo "[ERROR] DB host must resolve to $DB only"; ok=0; }
            if [ "$ok" = 1 ]; then rm -f "$STATE"; echo "[MESSAGE] Database host check passed"; exit 0; fi
            if [ -f "$STATE" ]; then
              STAMP=$(sed -n 1p "$STATE")
              for f in $(tail -n +2 "$STATE"); do cp "$f.bak-$STAMP" "$f"; done
              rm -f "$STATE"
              docker compose up -d --force-recreate api
              echo "[ERROR] Restored the previous DATABASE_URL"
            fi
            exit 1
            CHECK_DB_HOST
            fi

            echo "[MESSAGE] Cleaning up old images..."
            docker image prune -f

            if [ "$CHECK_STATUS" != 0 ]; then echo "[ERROR] Deployment failed the database host check"; exit 1; fi
            echo "[MESSAGE] Deployment completed!"
