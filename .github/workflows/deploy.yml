name: "DEPLOY MEEDO API"

on:
  push:
    branches: ["main", "staging"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "TAG=prod" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/meedo-v3/prod" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == 'refs/heads/staging' ]]; then
            echo "TAG=stg" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/meedo-v3/stg" >> $GITHUB_ENV
          else
            echo "TAG=dev" >> $GITHUB_ENV
            echo "DEPLOY_PATH=docker-apps/meedo-v3/dev" >> $GITHUB_ENV
          fi

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API
        run: |
          docker build -t geoplanoperation/meedo-api:${{ env.TAG }} -f Dockerfile .
          docker push geoplanoperation/meedo-api:${{ env.TAG }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/${{ env.DEPLOY_PATH }}
            echo "[MESSAGE] Preparing image for ${{ env.TAG }}...."

            # Export the image name for docker-compose
            export API_IMAGE="geoplanoperation/meedo-api:${{ env.TAG }}"

            echo "[MESSAGE] Pulling latest image..."
            docker compose pull api

            # Staging only. geo-postgres also answers to the name "meedo-v3-db-stg" on geo-network,
            # so each new DB connection landed on one of two databases at random (sessions "vanished",
            # users were logged out, writes were split). Give the real staging DB a name only it has
            # and point DATABASE_URL at it. Runs once; later deploys see the env already changed.
            if [ "${{ env.TAG }}" = "stg" ]; then
            bash <<'APPLY_DB_ALIAS'
            set -euo pipefail
            DB=meedo-v3-db-stg; ALIAS=meedo-stg-postgres; STATE=.db-alias-fix.state
            ENVFILES=$(grep -l "@$DB:5432/" .env .env.* *.env 2>/dev/null | grep -v '\.bak-' || true)
            if [ -z "$ENVFILES" ]; then echo "[MESSAGE] No env file here uses @$DB:5432/; nothing to change"; exit 0; fi
            if [ -e docker-compose.override.yml ] && ! grep -q "$ALIAS" docker-compose.override.yml; then
              echo "[ERROR] docker-compose.override.yml exists and was not written by this step; leaving it alone"; exit 1
            fi
            if ! docker compose config --networks | grep -qx geo-network; then
              echo "[ERROR] the compose file has no network named geo-network; cannot add the alias"; exit 1
            fi
            SERVICE=$(docker inspect "$DB" -f '{{index .Config.Labels "com.docker.compose.service"}}')
            STAMP=$(date +%Y%m%d%H%M%S)
            rollback() {
              for f in $ENVFILES; do [ -f "$f.bak-$STAMP" ] && cp "$f.bak-$STAMP" "$f"; done
              rm -f docker-compose.override.yml "$STATE"
              docker compose up -d --no-deps "$SERVICE" || true
            }
            trap 'echo "[ERROR] staging DB alias step failed; restoring the previous setup"; rollback' ERR
            for f in $ENVFILES; do cp "$f" "$f.bak-$STAMP"; done
            printf '%s\n' "$STAMP" "$SERVICE" $ENVFILES > "$STATE"
            printf 'services:\n  %s:\n    networks:\n      geo-network:\n        aliases:\n          - %s\n' "$SERVICE" "$ALIAS" > docker-compose.override.yml
            docker compose config "$SERVICE" | grep -q "$ALIAS"
            for f in $ENVFILES; do sed -i "s#@$DB:5432/#@$ALIAS:5432/#" "$f"; done
            docker compose up -d --no-deps "$SERVICE"
            echo "[MESSAGE] Staging DB is now reachable as $ALIAS (env backups: *.bak-$STAMP)"
            APPLY_DB_ALIAS
            fi

            echo "[MESSAGE] Deploying service..."
            docker compose up -d --force-recreate api

            # Staging only: the API must start and its DB host must resolve to exactly one container.
            # If the step above changed anything and this fails, it is undone and the deploy fails.
            CHECK_STATUS=0
            if [ "${{ env.TAG }}" = "stg" ]; then
            bash <<'CHECK_DB_HOST' || CHECK_STATUS=1
            set -uo pipefail
            API=meedo-v3-api-stg; STATE=.db-alias-fix.state
            health() { docker exec "$API" sh -c 'wget -qO- "http://localhost:${PORT:-8000}/api/v1/health"' >/dev/null 2>&1; }
            for i in $(seq 1 40); do health && break; sleep 3; done
            ok=1; health || { echo "[ERROR] API health check failed"; ok=0; }
            HOST=$(docker exec "$API" printenv DATABASE_URL | sed -E 's#^[^@]*@([^:/]+).*#\1#')
            ADDRS=$(docker exec "$API" nslookup "$HOST" 2>/dev/null | awk '/^Address/ && $2 !~ /:53$/ {print $2}' | sort -u)
            echo "[MESSAGE] DB host $HOST resolves to: $(echo $ADDRS)"
            [ "$(printf '%s\n' "$ADDRS" | grep -c .)" = 1 ] || { echo "[ERROR] DB host must resolve to exactly one address"; ok=0; }
            if [ "$ok" = 1 ]; then rm -f "$STATE"; echo "[MESSAGE] Database host check passed"; exit 0; fi
            if [ -f "$STATE" ]; then
              STAMP=$(sed -n 1p "$STATE"); SERVICE=$(sed -n 2p "$STATE")
              for f in $(tail -n +3 "$STATE"); do cp "$f.bak-$STAMP" "$f"; done
              rm -f docker-compose.override.yml "$STATE"
              docker compose up -d --no-deps "$SERVICE" api
              echo "[ERROR] Restored the previous DB settings"
            fi
            exit 1
            CHECK_DB_HOST
            fi

            echo "[MESSAGE] Cleaning up old images..."
            docker image prune -f

            if [ "$CHECK_STATUS" != 0 ]; then echo "[ERROR] Deployment failed the database host check"; exit 1; fi
            echo "[MESSAGE] Deployment completed!"
